# Static Next export + explicitly scoped legacy applications.
# Include inside the existing HTTPS server IN PLACE OF its location / block.
# Keep existing API/media/other-service locations. Do not add duplicate locations
# when park-routes or equivalent SPA locations are already installed.
location ^~ /p/ {
    root /home/sunny-rentals/dist;
    try_files /p/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}
location ^~ /owner/ {
    root /home/sunny-rentals/dist;
    try_files /owner/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
location = /p { return 308 /p/; }
location = /owner { return 308 /owner/; }

# Deliberate client-side application namespaces, not public marketing fallback.
location ~ ^/(app|admin|dashboard|offer|platform-admin)(/|$) {
    root /home/sunny-rentals/dist;
    try_files $uri $uri/ /app/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Published blog compatibility and offers already have generated static entries.
# Unknown slugs, images and public pages must NOT become a 200 homepage.
location / {
    root /home/sunny-rentals/dist;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
}
location = /404.html {
    root /home/sunny-rentals/dist;
    internal;
    add_header X-Robots-Tag "noindex, follow" always;
}
