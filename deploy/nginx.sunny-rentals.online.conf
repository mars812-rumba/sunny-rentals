server {
    server_name sunny-rentals.online;

    client_max_body_size 50m;

    # Unrelated applications already hosted on this domain remain unchanged.
    location = /food-market {
        return 301 /food-market/;
    }

    location /food-market/ {
        alias /var/www/foodmarket/dist/;
        index index.html;
        try_files $uri $uri/ /food-market/index.html;
    }

    location /food-market-api/ {
        rewrite ^/food-market-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /food-market-api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # Sunny Rentals backend and media.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images_web/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /botapi/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Existing Dimohod application on port 3000 remains untouched.
    location = /dymohod {
        return 301 /dimohod;
    }

    location /dymohod/ {
        rewrite ^/dymohod/(.*)$ /dimohod/$1 permanent;
    }

    location = /dimohod {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dimohod;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location /dimohod/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dimohod;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location /dimohod-media/ {
        alias /home/dimohod-trade/storage/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Next.js immutable assets and public hero media.
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /vehicles/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logo.png {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /hero_bg.webp {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /hero_bg_mobile.png {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /telegram.webp {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /whatsapp.webp {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Stage 1 cutover: only routes that already exist in Next.js.
    location = / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /cars {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /cars/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Vite remains responsible for /app, admin, current blog/offers and fallback.
    location ^~ /assets/ {
        alias /home/sunny-rentals/current/legacy/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(app|admin|dashboard|offer)(/|$) {
        root /home/sunny-rentals/current/legacy;
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/(blog|offers)(/|$) {
        root /home/sunny-rentals/current/legacy;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /home/sunny-rentals/current/legacy;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sunny-rentals.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunny-rentals.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = sunny-rentals.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name sunny-rentals.online;
    return 404;
}
