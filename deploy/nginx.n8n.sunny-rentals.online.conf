server {
    # Allow recrawling so Google can see noindex on already indexed URLs.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
    add_header X-Robots-Tag "noindex, nofollow" always;
  server_name n8n.sunny-rentals.online;

  client_max_body_size 20m;

  # WebSocket + reverse proxy for n8n
  location / {
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;

    # Critical: WebSocket upgrade headers (fixes "Connection lost" in n8n UI)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts — n8n executions can be long-running
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Disable buffering so SSE/WebSocket push works
    proxy_buffering off;
    proxy_cache off;

    # Chunked transfer encoding for streaming
    proxy_set_header Accept-Encoding "";
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/n8n.sunny-rentals.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/n8n.sunny-rentals.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($host = n8n.sunny-rentals.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name n8n.sunny-rentals.online;
    return 404; # managed by Certbot


}
