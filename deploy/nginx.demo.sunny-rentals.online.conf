server {
    # Allow recrawling so Google can see noindex on already indexed URLs.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_name demo.sunny-rentals.online;

    location / {
        root /home/rentmanager/dist;
        try_files $uri $uri/ /index.html;
    }

    location /admin/app {
        root /home/rentmanager/dist;
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        alias /home/rentmanager/dist/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location /images_web/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/demo.sunny-rentals.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.sunny-rentals.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($host = demo.sunny-rentals.online) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name demo.sunny-rentals.online;
    return 404;
}
