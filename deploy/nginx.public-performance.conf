# Include ONCE inside Sunny's existing HTTPS server, alongside its public
# static route fragment. This file does not change APIs, other apps or HTML.
# Requires an explicit operator nginx -t + reload; deploy.sh does NOT install it.
location ^~ /_next/static/ {
    root /home/sunny-rentals/dist;
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Next content-hashed assets only; never HTML or mutable JSON endpoints.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /fonts/ {
    root /home/sunny-rentals/dist;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
}

location ^~ /images/atmosphere/ {
    root /home/sunny-rentals/dist;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
}

location = /logo.png.webp {
    root /home/sunny-rentals/dist;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
}
