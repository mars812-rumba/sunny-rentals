server {
    # Allow recrawling so Google can see noindex on already indexed URLs.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_name weldwood.sunny-rentals.online;
    root /home/loft_fire/simple-ar/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
    }
    location /images_web/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/weldwood.sunny-rentals.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weldwood.sunny-rentals.online/privkey.pem;
}
