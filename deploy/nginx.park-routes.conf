# Include inside the existing HTTPS server for sunny-rentals.online.
# This fragment intentionally changes only tenant SPA routing, not other sites.
# Shared entry points work even for parks created after the latest release.
location ^~ /p/ {
    root /home/sunny-rentals/dist;
    try_files /p/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /owner/ {
    root /home/sunny-rentals/dist;
    try_files /owner/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
